name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    # 台北時間每日 00:17 重建，讓已過期場次自動移至舉辦紀錄。
    - cron: '17 16 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
        env:
          # 暫不開放搜尋引擎收錄：footer 的就業服務許可資訊尚未填入（見 CLAUDE.md）。
          # 資料補齊、確認可正式對外後，刪掉這兩行即可讓 Google 收錄。
          TSUNAGU_NOINDEX: '1'
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
